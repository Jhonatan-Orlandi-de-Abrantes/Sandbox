<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Física com Respawn</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
  const { Engine, Render, World, Bodies, Mouse, MouseConstraint, Events, Body } = Matter;

  const engine = Engine.create();
  const world = engine.world;

  const render = Render.create({
    element: document.body,
    engine: engine,
    options: {
      width: window.innerWidth,
      height: window.innerHeight,
      wireframes: false,
      background: '#111'
    }
  });

  Render.run(render);
  Engine.run(engine);

  function randomColor() {
    const colors = ["#ff4d4d","#4dff88","#4da6ff","#ffff66","#ff66ff","#66ffff"];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  const boxes = [];

  for (let i = 0; i < 12; i++) {
    const size = Math.random() * 80 + 30;

    const box = Bodies.rectangle(
      Math.random() * window.innerWidth,
      Math.random() * 200,
      size,
      size,
      {
        restitution: 0.6,
        friction: 0.2,
        density: 0.002,
        render: { fillStyle: randomColor() }
      }
    );

    box.originalSize = size; // guardamos info
    boxes.push(box);
  }

  // ✅ chão
  const ground = Bodies.rectangle(
    window.innerWidth / 2,
    window.innerHeight + 50,
    window.innerWidth,
    100,
    { isStatic: true }
  );

  // ✅ paredes laterais
  const leftWall = Bodies.rectangle(-50, window.innerHeight/2, 100, window.innerHeight, { isStatic: true });
  const rightWall = Bodies.rectangle(window.innerWidth+50, window.innerHeight/2, 100, window.innerHeight, { isStatic: true });

  // ✅ TETO INVISÍVEL (fora da tela)
  const ceiling = Bodies.rectangle(
    window.innerWidth/2,
    -200, // bem acima da tela
    window.innerWidth,
    100,
    { isStatic: true }
  );

  World.add(world, [...boxes, ground, leftWall, rightWall, ceiling]);

  // ✅ mouse
  const mouse = Mouse.create(render.canvas);
  const mouseConstraint = MouseConstraint.create(engine, {
    mouse: mouse,
    constraint: {
      stiffness: 0.2,
      render: { visible: false }
    }
  });

  World.add(world, mouseConstraint);
  render.mouse = mouse;

  // ✅ SISTEMA DE RESPAWN
  Events.on(engine, "beforeUpdate", () => {
    boxes.forEach(box => {
      // Se subir muito (acima do teto com margem)
      if (box.position.y < -300) {
        Body.setPosition(box, {
          x: Math.random() * window.innerWidth,
          y: Math.random() * 100
        });

        // zera velocidade para evitar bugs
        Body.setVelocity(box, { x: 0, y: 0 });
        Body.setAngularVelocity(box, 0);
      }
    });
  });

  // resize
  window.addEventListener("resize", () => {
    render.canvas.width = window.innerWidth;
    render.canvas.height = window.innerHeight;
  });

</script>

</body>
</html>
